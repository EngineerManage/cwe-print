name: Build & Release

# 触发方式：
#  1) 推送到 main / master / dev 分支 → 构建 win+mac，并把安装包发布到 Releases
#  2) 手动在 Actions 页面点击 Run workflow → 同样构建并发布
on:
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  # ── 1) Electron 版本分平台构建 ──
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-2022
            platform: win
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Build (macOS)
        if: matrix.platform == 'mac'
        working-directory: electron
        run: npm run build && npx electron-builder --mac --publish never

      - name: Build (Windows)
        if: matrix.platform == 'win'
        working-directory: electron
        run: npm run build && npx electron-builder --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}-installers
          retention-days: 14
          if-no-files-found: warn
          path: |
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/*.zip
            electron/dist/*.blockmap
            electron/dist/latest*.yml

  # ── 2) Rust / Tauri 版本分平台构建，安装包产品名为 “CWE Print Rust” ──
  build-rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-2022
            platform: win
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rust/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET
        if: matrix.platform == 'win'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/src-tauri -> target

      - name: Install dependencies
        working-directory: rust
        run: npm ci

      - name: Verify Tauri icons
        shell: bash
        run: |
          set -euo pipefail
          ls -la rust/src-tauri/icons
          test -f rust/src-tauri/icons/icon.ico
          test -f rust/src-tauri/icons/icon.icns
          test -f rust/src-tauri/icons/32x32.png
          test -f rust/src-tauri/icons/128x128.png
          test -f rust/src-tauri/icons/128x128@2x.png

      - name: Build WebView2 print helper
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $out = "rust/src-tauri/resources/webview2-print-helper"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish rust/webview2-print-helper/WebView2PrintHelper.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -o $out
          Get-ChildItem $out

      - name: Build Rust/Tauri app
        working-directory: rust
        run: npm run tauri:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.platform }}-installers
          retention-days: 14
          if-no-files-found: warn
          path: |
            rust/src-tauri/target/release/bundle/dmg/*.dmg
            rust/src-tauri/target/release/bundle/nsis/*.exe
            rust/src-tauri/target/release/bundle/msi/*.msi

  # ── 3) 汇总 Electron + Rust/Tauri 所有平台产物，发布到同一个 Release ──
  release:
    needs:
      - build-electron
      - build-rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: ver
        run: echo "version=$(node -p "require('./electron/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          # 同版本重复推送时，会更新这同一个 Release 的安装包（最新构建覆盖旧的）
          files: artifacts/**/*
          fail_on_unmatched_files: false
